<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Student Progress · Marks Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#17171a;--muted:#6c6a66;--line:#e3e1dc;--brass:#a8711c;--good:#2f7a4b;--display:"Instrument Serif",Georgia,serif;--body:"Familjen Grotesk",Arial,sans-serif;--mono:"JetBrains Mono",monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--surface:#1b1b1e;--ink:#efede8;--muted:#9a978f;--line:#2c2b2f;--brass:#d9a24a;--good:#6cc28e;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}button,input{font:inherit;color:inherit}button{cursor:pointer}.wrap{max-width:640px;margin:0 auto;padding:28px 0 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}.brand{font:26px/1 var(--display)}.brand em{color:var(--brass)}.wordmark{font:clamp(56px,14vw,96px)/.9 var(--display);margin:0}.wordmark em{color:var(--brass)}.sub,.note,.meta{color:var(--muted)}.login{min-height:calc(100vh - 92px);display:grid;align-content:center;gap:22px}.form{display:grid;gap:10px;max-width:420px}.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.field:focus{outline:2px solid var(--brass);outline-offset:1px}.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:600}.btn.brass{background:var(--brass);color:#fff}.btn:disabled{opacity:.5}.ghost{background:none;border:0;color:var(--muted);padding:7px 9px;border-radius:8px}.ghost:hover{color:var(--ink)}.err{min-height:1.5em;color:#b0352b;margin:0}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:999px 999px 0 0}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.title{font:clamp(36px,9vw,52px)/1 var(--display);margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 32px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font:700 22px var(--mono)}.stat span{font-size:12px;color:var(--muted)}.group{display:grid;margin-bottom:28px}.label{font:500 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}.prog{display:grid;grid-template-columns:minmax(0,1fr) 100px 64px;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}.prog .nm{min-width:0}.prog .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prog .nm small{font-size:12px;color:var(--muted)}.prog svg{width:100px;height:30px}.prog polyline{fill:none;stroke:var(--brass);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.prog circle{fill:var(--brass)}.score{text-align:right}.score b{display:block;font:700 18px var(--mono)}.score small{font:500 11px var(--mono);color:var(--muted)}.history{display:grid;gap:22px}.day h3{font:400 24px/1.1 var(--display);margin:0 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}.entry{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}.entry .exercise{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry .score{font:700 15px var(--mono);white-space:nowrap}.change{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px}.change h2{font:30px/1.1 var(--display);margin:0}.small{font-size:13px}.empty{padding:16px 2px;color:var(--muted)}@media(max-width:460px){.prog{grid-template-columns:minmax(0,1fr) 70px 56px;gap:7px}.prog svg{width:70px}.stat b{font-size:18px}.top{margin-bottom:26px}}
</style>
</head>
<body>
<main class="wrap">
  <section id="login" class="login">
    <h1 class="wordmark">Marks<br><em>Music</em></h1>
    <p class="sub">Sign in to see your guitar progress and class log.</p>
    <form id="loginForm" class="form" autocomplete="on">
      <input id="username" class="field" autocomplete="username" placeholder="Your full name" aria-label="Username" required>
      <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      <button id="loginButton" class="btn" type="submit">Sign in</button>
    </form>
    <p id="loginError" class="err" role="alert"></p>
    <p class="note small">Need help signing in? Contact your teacher.</p>
  </section>

  <section id="app" hidden>
    <header class="top"><div class="brand">Marks <em>Music</em></div><button id="logout" class="ghost" type="button">Sign out</button></header>
    <div id="passwordChange" class="change" hidden>
      <h2>Choose a new password</h2>
      <p class="note">This is a temporary password. Choose a private password with at least 12 characters. Your teacher can reset it if you forget it.</p>
      <form id="changeForm" class="form">
        <input id="newPassword" class="field" type="password" autocomplete="new-password" minlength="12" placeholder="New password" required>
        <input id="confirmPassword" class="field" type="password" autocomplete="new-password" minlength="12" placeholder="Confirm new password" required>
        <button id="changeButton" class="btn brass" type="submit">Save password</button>
      </form>
      <p id="changeError" class="err" role="alert"></p>
    </div>
    <div id="studentPages" hidden>
      <section id="progressPage">
        <div class="pagehead"><h1 id="studentName" class="title"></h1></div>
        <p id="progressNote" class="meta"></p>
        <div id="progress"></div>
      </section>
    </div>
  </section>
</main>
<script>
(() => {
"use strict";
const API = "https://jfylfmdzkfaprqmcoxwx.supabase.co/functions/v1/student-portal";
const $ = id => document.getElementById(id);
const STORAGE_KEY = "marks_music_student_session";
const tidy = value => String(value || "").replace(/\b\w/g, character => character.toUpperCase());
let session = null, student = null, items = [], logs = [];
const itemById = new Map();
function saveSession(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch {} }
function clearSession(){ session = null; try { localStorage.removeItem(STORAGE_KEY); } catch {} }
async function post(action, data = {}, withToken = true){
  let response;
  try {
    const headers = { "Content-Type": "application/json" };
    if (withToken && session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
    response = await fetch(API, { method: "POST", headers, body: JSON.stringify({ action, ...data }) });
  } catch { throw { code: "offline" }; }
  let body = {}; try { body = await response.json(); } catch {}
  return { response, body };
}
async function api(action, data = {}, allowRefresh = true){
  let { response, body } = await post(action, data, action !== "student_login" && action !== "student_refresh");
  if (response.status === 401 && allowRefresh && session?.refresh_token && action !== "student_login" && action !== "student_refresh"){
    try {
      const refreshed = await post("student_refresh", { refresh_token: session.refresh_token }, false);
      if (!refreshed.response.ok) throw { code: refreshed.body.error || "session_expired" };
      session = refreshed.body; saveSession();
      return api(action, data, false);
    } catch { clearSession(); throw { code: "session_expired" }; }
  }
  if (!response.ok) throw { code: body.error || "server_error", status: response.status };
  return body;
}
function errorText(error){
  if (error?.code === "wrong_credentials") return "That name or password isn't right.";
  if (error?.code === "session_expired" || error?.code === "unauthorized") return "Your sign-in expired. Please sign in again.";
  if (error?.code === "password_too_short") return "Choose a password with at least 12 characters.";
  if (error?.code === "password_too_long") return "Choose a shorter password.";
  if (error?.code === "offline") return "Can't reach the server. Check your internet connection and try again.";
  return "Something went wrong. Please try again or contact your teacher.";
}
function showLogin(message = ""){
  $("app").hidden = true; $("login").hidden = false; $("loginError").textContent = message;
}
function showApp(){ $("login").hidden = true; $("app").hidden = false; }
async function loadPortal(){
  const [base, historyData] = await Promise.all([api("student_bootstrap"), api("student_history")]);
  student = base.student; items = base.items || []; logs = historyData.logs || [];
  items.forEach(item => itemById.set(Number(item.id), item));
  $("studentName").textContent = student.name;
  $("progressNote").textContent = logs.length ? "Your progress from every saved class." : "No class scores have been saved yet.";
  drawProgress();
  $("passwordChange").hidden = true; $("studentPages").hidden = false;
}
async function openSession(data){
  session = data; saveSession();
  student = data.student;
  showApp();
  if (student.must_change_password){
    $("passwordChange").hidden = false; $("studentPages").hidden = true;
    $("newPassword").focus();
  } else {
    $("passwordChange").hidden = true;
    await loadPortal();
  }
}
function spark(points){
  const svgNS = "http://www.w3.org/2000/svg", W = 100, H = 26;
  const values = points.map(point => Number(point.score));
  const low = Math.min(...values), high = Math.max(...values), span = high - low || 1;
  const coords = values.map((value, index) => [points.length === 1 ? W : index * W / (points.length - 1), H - ((value - low) / span) * H + 2]);
  const svg = document.createElementNS(svgNS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H + 4}`); svg.setAttribute("aria-hidden", "true");
  if (points.length > 1){ const line = document.createElementNS(svgNS, "polyline"); line.setAttribute("points", coords.map(point => point.join(",")).join(" ")); svg.appendChild(line); }
  const [x, y] = coords[coords.length - 1], dot = document.createElementNS(svgNS, "circle"); dot.setAttribute("cx", String(x)); dot.setAttribute("cy", String(y)); dot.setAttribute("r", "2.6"); svg.appendChild(dot);
  return svg;
}
function dateLabel(date, options = { day: "numeric", month: "short", year: "numeric" }){ return new Date(`${date}T00:00:00`).toLocaleDateString(undefined, options); }
function drawProgress(){
  const byItem = new Map();
  for (const log of logs){ const id = Number(log.item_id); if (!byItem.has(id)) byItem.set(id, []); byItem.get(id).push(log); }
  const rows = [...byItem].map(([id, points]) => ({ item: itemById.get(id) || { name: `Exercise ${id}`, cat: "Other", order: 1e9 }, points, best: Math.max(...points.map(p => Number(p.score))) }));
  const root = $("progress"); root.innerHTML = "";
  if (!rows.length){ root.innerHTML = '<p class="empty">Your progress will appear here after your first class is logged.</p>'; return; }
  rows.sort((a, b) => Number(a.item.order ?? 1e9) - Number(b.item.order ?? 1e9));
  const groups = new Map();
  for (const row of rows){ const category = row.item.cat || "Other"; if (!groups.has(category)) groups.set(category, []); groups.get(category).push(row); }
  for (const [category, group] of groups){
    const section = document.createElement("section"); section.className = "group";
    const label = document.createElement("div"); label.className = "label"; label.textContent = category; section.appendChild(label);
    for (const row of group){
      const entry = document.createElement("div"); entry.className = "prog";
      const name = document.createElement("div"); name.className = "nm";
      const title = document.createElement("b"); title.textContent = tidy(row.item.name);
      const detail = document.createElement("small"); const last = row.points[row.points.length - 1];
      detail.textContent = `${row.points.length}× · last ${dateLabel(last.date, { day: "numeric", month: "short" })}`;
      name.append(title, detail);
      const chart = spark(row.points);
      const score = document.createElement("div"); score.className = "score";
      const best = document.createElement("b"); best.textContent = String(row.best);
      const hint = document.createElement("small"); hint.textContent = "best BPM"; score.append(best, hint);
      entry.append(name, chart, score); section.appendChild(entry);
    }
    root.appendChild(section);
  }
}
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault(); const button = $("loginButton");
  button.disabled = true; button.textContent = "Signing in…"; $("loginError").textContent = "";
  try {
    const data = await api("student_login", { username: $("username").value.trim(), password: $("password").value });
    await openSession(data);
  } catch (error) {
    if (session?.access_token) { showApp(); $("progressNote").textContent = errorText(error); }
    else showLogin(errorText(error));
  }
  finally { button.disabled = false; button.textContent = "Sign in"; }
});
$("changeForm").addEventListener("submit", async event => {
  event.preventDefault(); const button = $("changeButton"), password = $("newPassword").value;
  $("changeError").textContent = "";
  if (password !== $("confirmPassword").value){ $("changeError").textContent = "Those passwords don't match."; return; }
  if (password.length < 12){ $("changeError").textContent = "Choose a password with at least 12 characters."; return; }
  button.disabled = true; button.textContent = "Saving…";
  try {
    await api("student_change_password", { new_password: password });
    session.student.must_change_password = false; saveSession();
    $("changeForm").reset(); await loadPortal();
  } catch (error) { $("changeError").textContent = errorText(error); }
  finally { button.disabled = false; button.textContent = "Save password"; }
});
$("logout").addEventListener("click", async () => {
  try { if (session?.access_token) await api("student_logout"); } catch {}
  clearSession(); showLogin();
});
async function restoreSession(){
  let saved;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { saved = null; }
  if (!saved?.refresh_token) return;
  session = saved;
  try { await openSession(await api("student_refresh", { refresh_token: saved.refresh_token })); }
  catch (error) { clearSession(); showLogin(errorText(error)); }
}
restoreSession();
})();
</script>
</body>
</html>
